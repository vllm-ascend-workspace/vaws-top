name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    name: backend tests (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The backend is stdlib-only and must stay runnable without torch,
      # torch_npu or NPU hardware; nothing is installed here on purpose.
      - name: Run backend unit tests
        run: python3 scripts/run-backend-tests.py

  frontend-build:
    # The dashboard build depends on pre-release packages (vinext beta,
    # Cloudflare/OpenAI Vite plugins) fetched from the public npm registry. It
    # needs network access and is slower and less deterministic than the
    # backend suite, so it runs as a separate job and does not gate the
    # backend result. If it turns out to be flaky, drop it rather than mark
    # it `continue-on-error`.
    name: frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build
